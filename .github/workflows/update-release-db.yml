name: Update Release Database

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-d1:
    runs-on: ubuntu-latest

    steps:
      - name: Get release information
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          assets=$(gh release view "$TAG_NAME" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets')

          windows_url=$(echo "$assets" | jq -r \
            '.[] | select(.name | endswith("-Setup.exe")) | .url' | head -n 1)

          linux_url=$(echo "$assets" | jq -r \
            '.[] | select(.name | endswith("-x86_64.AppImage")) | .url' | head -n 1)

          if [ -z "$windows_url" ] || [ "$windows_url" = "null" ]; then
            echo "Windows release asset not found."
            exit 1
          fi

          if [ -z "$linux_url" ] || [ "$linux_url" = "null" ]; then
            echo "Linux release asset not found."
            exit 1
          fi

          version="${TAG_NAME#v}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "windows_url=$windows_url" >> "$GITHUB_OUTPUT"
          echo "linux_url=$linux_url" >> "$GITHUB_OUTPUT"

      - name: Install Wrangler
        run: npm install -g wrangler@4.123.0

      - name: Update Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.release.outputs.version }}
          WINDOWS_URL: ${{ steps.release.outputs.windows_url }}
          LINUX_URL: ${{ steps.release.outputs.linux_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          sql=$(printf \
            "INSERT INTO releases (version, windows_url, linux_url, published_at) VALUES ('%s', '%s', '%s', '%s');" \
            "$VERSION" \
            "$WINDOWS_URL" \
            "$LINUX_URL" \
            "$PUBLISHED_AT")

          npx wrangler d1 execute rocket-client-db \
            --remote \
            --command "$sql"
