plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '1.0.0'
}

group = 'com.rogueclient'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

def currentPlatform = System.getProperty('os.name').toLowerCase().contains('win') ? 'win' :
                      System.getProperty('os.name').toLowerCase().contains('mac') ? 'mac' : 'linux'

javafx {
    version = '22'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing', 'javafx.web']
    platform = currentPlatform
}

application {
    mainClass = 'com.rogueclient.Main'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.rogueclient.Main',
            'Class-Path': configurations.runtimeClasspath.files.collect { it.name }.join(' ')
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task copyDeps(type: Copy) {
    from configurations.runtimeClasspath
    into 'build/libs'
}

build.dependsOn copyDeps

task fatJar(type: Jar) {
    manifest {
        attributes(
            'Main-Class': 'com.rogueclient.Main'
        )
    }
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    with jar
}

// Bakes the single project version (above) into a resource file every build, so
// AppVersion.java has one real source of truth instead of every window hardcoding
// its own version string.
task generateVersionResource {
    def outputDir = file("$buildDir/generated/resources")
    def outputFile = file("$outputDir/version.properties")
    outputs.file(outputFile)
    doLast {
        outputDir.mkdirs()
        outputFile.text = "version=${project.version}\n"
    }
}
sourceSets.main.resources.srcDir "$buildDir/generated/resources"
processResources.dependsOn generateVersionResource
